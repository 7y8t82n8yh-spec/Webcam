[package]
name = "web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The phone page of iPhone Webcam, compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.106"
protocol = { path = "../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Window", "Document", "Element", "HtmlElement", "HtmlMediaElement", "HtmlVideoElement", "HtmlImageElement", "console", "MediaStreamTrackState", "HtmlCanvasElement", "HtmlSelectElement", "HtmlOptionElement", "HtmlOptionsCollection", "CanvasRenderingContext2d", "Blob", "Navigator", "MediaDevices", "MediaStream", "MediaStreamTrack", "MediaStreamConstraints", "Location", "UrlSearchParams", "Storage", "WebSocket", "MessageEvent", "BinaryType", "Event", "EventTarget", "DomTokenList", "RtcPeerConnection", "RtcConfiguration", "RtcRtpTransceiver", "RtcRtpTransceiverInit", "RtcRtpTransceiverDirection", "RtcRtpSender", "RtcDataChannel", "RtcSessionDescriptionInit", "RtcSdpType", "RtcSessionDescription", "RtcPeerConnectionState", "RtcIceGatheringState", "RtcStatsReport", "Request", "RequestInit", "Response", "Headers", "AbortController", "AbortSignal", "WakeLock", "WakeLockSentinel", "WakeLockType", "Performance", "VisibilityState"] }

[lints]
workspace = true
